<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davomat & Telegram Desktop</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Internet Status Notification Banner -->
    <div id="netStatusBanner" class="net-status-banner net-online" style="display:none;">
        <span id="netStatusText"><i class="fas fa-wifi"></i> Internet tarmog'iga ulandi</span>
    </div>

    <!-- Fullscreen Offline Warning Overlay -->
    <div id="offlineOverlay" class="offline-overlay" style="display:none;">
        <div class="offline-card">
            <div class="offline-icon"><i class="fas fa-wifi-slash"></i></div>
            <h2>Internet Aloqasi Uzildi!</h2>
            <p>Iltimos, Wi-Fi yoki Kabel tarmog'ingizni tekshiring. Internet uzildi! Internetga ulanganingizdan so'ng ma'lumotlar avtomatik ravishda yuboriladi va sahifa qayta yangilanadi.</p>
            <button id="btnRetryNet" class="retry-net-btn">
                <i class="fas fa-sync-alt"></i> Qayta Tekshirish
            </button>
        </div>
    </div>

    <!-- Top Glassmorphic Titlebar & Quick Controls -->
    <header class="titlebar">
        <div class="titlebar-left">
            <img src="../assets/main_logo.jpg" class="app-logo" alt="Logo" onerror="this.src='../assets/logo.png'">
            <span class="app-name">DAVOMAT <span class="app-badge">DESKTOP PRO</span></span>
            <span id="netIndicator" class="net-indicator net-ind-online" title="Internet holati"><i class="fas fa-signal"></i> Online</span>
        </div>

        <div class="titlebar-center">
            <div class="preset-buttons">
                <button id="btnPresetDefault" class="preset-btn active" title="75% Davomat + 25% Telegram Split">
                    <i class="fas fa-columns"></i> 75% / 25% Split
                </button>
                <button id="btnPresetDavomat" class="preset-btn" title="Faqat Davomat platformasi">
                    <i class="fas fa-desktop"></i> Davomat (100%)
                </button>
                <button id="btnPresetTelegram" class="preset-btn" title="Faqat Telegram Desktop">
                    <i class="fab fa-telegram-plane"></i> Telegram (100%)
                </button>
            </div>
            <button id="btnReloadAll" class="action-btn" title="Sahifalarni yangilash">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <div class="titlebar-right">
            <button class="win-btn win-min" id="winMinBtn" title="Kichraytirish"><i class="fas fa-minus"></i></button>
            <button class="win-btn win-max" id="winMaxBtn" title="Kattalashtirish"><i class="far fa-square"></i></button>
            <button class="win-btn win-close" id="winCloseBtn" title="Yopish"><i class="fas fa-times"></i></button>
        </div>
    </header>

    <!-- Main Workspace Split-Screen Container -->
    <main class="workspace" id="workspaceContainer">
        <!-- Left Panel: 75% Davomat Web Platform -->
        <div class="panel panel-left" id="panelDavomat">
            <div class="panel-header">
                <div class="panel-title"><i class="fas fa-globe"></i> Davomat Axborot Tizimi</div>
                <div class="panel-actions">
                    <button class="icon-btn" id="reloadDavomatBtn" title="Davomatni yangilash"><i class="fas fa-redo-alt"></i></button>
                    <button class="icon-btn" id="homeDavomatBtn" title="Asosiy sahifa"><i class="fas fa-home"></i></button>
                </div>
            </div>
            <div class="webview-wrapper">
                <webview id="davomatWebview" src="https://newferghanaregdavomat.vercel.app" allowpopups style="width:100%; height:100%; border:none;"></webview>
            </div>
        </div>

        <!-- Draggable Resizable Splitter Bar -->
        <div class="splitter" id="splitterHandle" title="Hajmini o'zgartirish uchun suring">
            <div class="splitter-line"></div>
        </div>

        <!-- Right Panel: 25% Telegram Web (Desktop Interface) -->
        <div class="panel panel-right" id="panelTelegram">
            <div class="panel-header telegram-header">
                <div class="panel-title"><i class="fab fa-telegram"></i> Telegram Desktop</div>
                <div class="panel-actions">
                    <button class="icon-btn" id="switchTgVersionBtn" title="Telegram Versiyasini Almashtirish (Web K / Web A)"><i class="fas fa-exchange-alt"></i></button>
                    <button class="icon-btn" id="reloadTgBtn" title="Telegramni yangilash"><i class="fas fa-redo-alt"></i></button>
                </div>
            </div>
            <div class="webview-wrapper">
                <webview id="telegramWebview" src="https://web.telegram.org/k/" allowpopups style="width:100%; height:100%; border:none;"></webview>
            </div>
        </div>
    </main>

    <script src="renderer.js"></script>
</body>
</html>
